# Builds the static site and publishes it to GitHub Pages.
# The page-relative export is used because Pages serves the site under /website-V3/.
#
# The live site is currently published from the gh-pages branch ("Deploy from a branch" in the repository's Pages
# settings), so this workflow only runs on demand or on pushes to main. To let it publish from a feature branch,
# allow that branch in the github-pages environment (Settings, Environments) and add it to the list below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build:relative
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out-relative

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
