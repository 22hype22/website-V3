# Builds the static site and publishes it to GitHub Pages on every push to these branches.
# The page-relative export is used because Pages serves the site under /website-V3/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/busy-bardeen-j3he5q]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build:relative
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out-relative

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
